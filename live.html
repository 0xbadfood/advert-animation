<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@500;600;700&display=swap">
<style>
  :root { --ink: #1d1a33; --muted: #6e6a86; --line: #e1ddec; --accent: #5b3fd1; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 "Inter", system-ui, sans-serif; color: var(--ink); background: #e9e7f1; }
  /* the emulator's controls; the live page itself is #stage */
  .bar { position: sticky; top: 0; z-index: 100; isolation: isolate; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--line); }
  .bar h1 { font-size: 15px; margin: 0 6px 0 0; font-weight: 800; }
  .bar select, .bar button { font: inherit; color: var(--ink); padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .bar button { font-weight: 700; cursor: pointer; }
  .bar button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .bar .grp { display: inline-flex; gap: 4px; }
  #film { max-width: 320px; }
  #seek { flex: 1 1 220px; accent-color: var(--accent); }
  #clock { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 108px; }
  #info { flex-basis: 100%; color: var(--muted); font-size: 12px; }
  #dbg { flex-basis: 100%; font: 11px/1.3 ui-monospace, monospace; color: #8a4600; }
  #dbg:empty { display: none; }
  .frame-wrap { position: relative; z-index: 0; isolation: isolate; padding: 20px 16px 40px; display: flex; justify-content: center; }
  /* the film modal is fixed to the window (a transform here would keep it inside the frame) */
  #frame { position: relative; background: #f6f5fa; overflow: auto; width: 100%; max-width: 1280px; height: calc(100vh - 140px); border-radius: 14px; box-shadow: 0 10px 40px rgba(29,26,51,.15); }
  body.phone #frame { width: 390px; height: min(844px, calc(100vh - 140px)); border-radius: 36px; border: 10px solid #1d1a33; }
  #stage { min-height: 100%; }
  #loading { position: fixed; inset: 0; display: none; place-items: center; background: rgba(233,231,241,.8); font-weight: 700; z-index: 30; }
  body.loading #loading { display: grid; }
</style>
</head>
<body>
<div class="bar">
  <h1>Live progress</h1>
  <select id="film" title="A finished advert film plays as the run"></select>
  <span class="grp" title="Stage lengths and the estimate's profile"><button id="local" class="on">Local timing</button><button id="cloud">Cloud timing</button></span>
  <span class="grp"><button id="desk" class="on">Desktop</button><button id="phone">Phone</button></span>
  <button id="play">Play</button>
  <button id="restart">Restart</button>
  <button id="reload" title="Rebuild the page at this moment, as a reload would (catch-up)">Reload</button>
  <select id="speed" title="Playback speed"><option>1</option><option>2</option><option selected>5</option><option>10</option><option>30</option></select>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <span id="clock"></span>
  <div id="info"></div>
  <div id="dbg"></div>
</div>
<div class="frame-wrap"><div id="frame"><div id="stage"></div></div></div>
<div id="loading">loading the film…</div>
<script type="module" src="/src/live/main.js"></script>
</body>
</html>
